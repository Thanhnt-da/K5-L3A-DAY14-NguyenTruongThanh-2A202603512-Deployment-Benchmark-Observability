# Exercise 7.3 — quality gate: block merging a PR when agent quality drops.
# run_eval.py exits 1 when accuracy < --min-accuracy or any question regresses
# vs --baseline, so this job fails and (with branch protection requiring
# the "eval" check) the PR cannot be merged.
name: quality-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent v2 (no random upstream errors in CI)
        run: |
          AGENT_VERSION=v2 PORT=8000 MOCK_ERROR_RATE=0 python app.py > agent.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 0.5
          done
          cat agent.log; exit 1
      - name: Eval + quality gate (fail if accuracy < 85% or any regression vs committed baseline)
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json \
            --out eval_ci.json
